# fly.toml app configuration file generated for zanjadora-app on 2026-08-14T09:32:37-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zanjadora-app'
primary_region = 'gru'

[build]

[[mounts]]
  source = "zanjadora_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
