{% extends "base.html" %}
{% block title %}Editar registro{% endblock %}
{% block content %}

<div class="page-head">
  <div>
    <h1>Editar registro</h1>
    <p class="muted">ZA-10707 — Zanjadora · {{ registro.fecha }}</p>
  </div>
</div>

<section class="panel form-panel">
  <form method="post" class="grid-form">
    <label>Fecha
      <input type="date" name="fecha" value="{{ registro.fecha }}" required>
    </label>
    <label>Turno
      <select name="turno">
        <option value="Día" {{ 'selected' if registro.turno == 'Día' else '' }}>Día</option>
        <option value="Noche" {{ 'selected' if registro.turno == 'Noche' else '' }}>Noche</option>
      </select>
    </label>
    <label>Operador
      <select name="operador" required>
        <option value="" disabled {{ 'selected' if not registro.operador else '' }}>Selecciona un operador</option>
        {% for o in operadores %}
        <option value="{{ o.nombre }}" {{ 'selected' if registro.operador == o.nombre else '' }}>{{ o.nombre }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Poza
      <select name="poza" required>
        <option value="" disabled {{ 'selected' if not registro.poza else '' }}>Selecciona una poza</option>
        {% for p in pozas %}
        <option value="{{ p.nombre }}" {{ 'selected' if registro.poza == p.nombre else '' }}>{{ p.nombre }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Horómetro inicial (h)
      <input type="number" step="0.1" name="horometro_inicial" value="{{ registro.horometro_inicial }}" required>
    </label>
    <label>Horómetro final (h)
      <input type="number" step="0.1" name="horometro_final" value="{{ registro.horometro_final }}" required>
    </label>
    <label>Combustible cargado (L)
      <input type="number" step="0.1" name="combustible_l" value="{{ registro.combustible_l }}" required>
    </label>
    <label>Avance perimetral (m lineal)
      <input type="number" step="0.1" name="avance_perimetral_m" value="{{ registro.avance_perimetral_m or 0 }}" required>
    </label>
    <label>Avance transversal (m lineal)
      <input type="number" step="0.1" name="avance_transversal_m" value="{{ registro.avance_transversal_m or 0 }}" required>
    </label>
    <label>Profundidad de zanja (cm)
      <input type="number" step="0.1" name="profundidad_cm" value="{{ registro.profundidad_cm or params.profundidad_zanja_cm }}">
    </label>
    <label>Uso sistema automático (h)
      <input type="number" step="0.1" name="horas_sistema_automatico" id="horas_sistema_automatico" value="{{ registro.horas_sistema_automatico or 0 }}">
      <span class="muted">Se recalcula con las horas operadas si cambias el horómetro — descuenta manualmente si hubo horas fuera de automático</span>
    </label>
    <label>Reemplazo de picas (cantidad)
      <input type="number" step="1" min="0" name="picas_reemplazadas" value="{{ registro.picas_reemplazadas or 0 }}">
    </label>
    <label>Identificación de roturas (cantidad)
      <input type="number" step="1" min="0" name="roturas_identificadas" value="{{ registro.roturas_identificadas or 0 }}">
    </label>
    <label class="span-2">Observaciones
      <textarea name="observaciones" rows="2" placeholder="Opcional">{{ registro.observaciones or '' }}</textarea>
    </label>
    <div class="span-2 form-actions">
      <button type="submit" class="btn-primary">Guardar cambios</button>
      <a href="{{ url_for('formulario') }}" class="btn-secondary">Cancelar</a>
    </div>
  </form>
</section>

<script>
  (function () {
    var inicial = document.querySelector('input[name="horometro_inicial"]');
    var final = document.querySelector('input[name="horometro_final"]');
    var automatico = document.getElementById('horas_sistema_automatico');
    if (!inicial || !final || !automatico) return;
    function actualizarAutomatico() {
      var hi = parseFloat(inicial.value);
      var hf = parseFloat(final.value);
      if (!isNaN(hi) && !isNaN(hf) && hf >= hi) {
        automatico.value = (hf - hi).toFixed(1);
      }
    }
    inicial.addEventListener('input', actualizarAutomatico);
    final.addEventListener('input', actualizarAutomatico);
  })();
</script>
{% endblock %}
