{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block bodyclass %}login-page{% endblock %}
{% block content %}
<div class="login-wrap">
  <form class="login-card" method="post">
    <div class="brand login-brand"><img src="{{ url_for('static', filename='besalco-logo-green.png') }}" alt="Besalco" class="brand-logo">Control de Maquinaria</div>
    <p class="muted">Zanjadora MAQ-001 — acceso interno</p>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    <label>Usuario
      <input type="text" name="nombre" placeholder="Ej: J. Pérez" required>
    </label>
    <label>Contraseña
      <input type="password" name="password" required>
    </label>
    <button type="submit">Entrar</button>
    <p class="muted login-hint">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Crear una</a></p>
  </form>
</div>
{% endblock %}
