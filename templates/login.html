{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="login-wrap">
  <form class="login-card" method="post">
    <div class="brand login-brand"><span class="brand-dot"></span>Control de Maquinaria</div>
    <p class="muted">Zanjadora MAQ-001 — acceso interno</p>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    <label>Tu nombre
      <input type="text" name="nombre" placeholder="Ej: J. Pérez" required>
    </label>
    <label>Contraseña de equipo
      <input type="password" name="password" required>
    </label>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
